# Runs on the GPU box (RTX 5060 Ti): only the model server. It listens on 127.0.0.1 and is
# reachable by the VPS only through the SSH reverse tunnel (madness-tunnel.service).
name: madness-gpu
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    network_mode: host          # binds to 127.0.0.1 only (see --host)
    environment:
      LLAMA_CACHE: /models
      LLAMA_API_KEY: ${LLM_API_KEY}
    volumes: ["./models:/models:Z"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    command:
      - -hf
      - ${LLM_MODEL:-unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M}
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --n-gpu-layers
      - all
      - --flash-attn
      - "on"
      - --ctx-size
      - ${LLM_CTX:-524288}      # one pool shared by all chats (--kv-unified); each chat can use up to 131072 (Qwen3.6 needs ~10 KB per token)
      - --parallel
      - ${LLM_PARALLEL:-4}      # chats generating at the same time; 4 x 131072 = 524288 so each can reach full size
      - --n-cpu-moe
      - ${LLM_CPU_MOE:-28}      # layers (of 40) whose experts stay in system RAM: the 22 GB model doesn't fit in 16 GB
      - --kv-unified
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      - --reasoning-format
      - deepseek
      - --no-mmproj               # text only: skip the vision projector, keep its GPU memory for chats
      - --temp
      - "0.6"                     # Qwen3.6's recommended sampling for thinking + coding; requests can override
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0"
      - --no-webui
