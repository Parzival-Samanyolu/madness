# Runs on the GPU box (RTX 5060 Ti): only the model server. It listens on 127.0.0.1 and is
# reachable by the VPS only through the SSH reverse tunnel (madness-tunnel.service).
name: madness-gpu
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    network_mode: host          # binds to 127.0.0.1 only (see --host)
    environment:
      LLAMA_CACHE: /models
      LLAMA_API_KEY: ${LLM_API_KEY}
    volumes: ["./models:/models:Z"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    command:
      - -hf
      # Inkling 2 Mini, 4-bit (17.6 GB). ggml-org's files are in mainline llama.cpp's layout; Unsloth's root
      # files are not. Needs llama.cpp b12611 or newer (older builds load it but answer garbage).
      - ${LLM_MODEL:-ggml-org/Inkling-2-Mini-GGUF:IQ4_NL}
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --n-gpu-layers
      - all
      - --flash-attn
      - "on"
      - --ctx-size
      - ${LLM_CTX:-262144}      # one pool shared by all chats (--kv-unified); each chat can use up to 131072 (Inkling 2 Mini needs ~17 KB per token)
      - --parallel
      - ${LLM_PARALLEL:-2}      # chats generating at the same time; 2 x 131072 = 262144 so each can reach the plans' 128k
      - --n-cpu-moe
      - ${LLM_CPU_MOE:-12}      # layers (of 24) whose experts stay in system RAM: the 17.6 GB model doesn't fit in 16 GB
      - --kv-unified
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      - --reasoning-format
      - deepseek
      - --no-mmproj               # text only: skip the vision tower, keep its GPU memory for chats
      - --temp
      - ${LLM_TEMP:-1.0}          # Inkling 2's recommended sampling: temperature 1, no truncation; requests can override
      - --top-p
      - ${LLM_TOP_P:-1.0}
      - --top-k
      - ${LLM_TOP_K:-0}
      - --min-p
      - ${LLM_MIN_P:-0}
      - --no-webui
