# How to change the database later:
#   1. edit app/models.py
#   2. .venv/bin/alembic revision --autogenerate -m "describe change"
#   3. check the file in migrations/versions/, commit it
# The API applies new migrations automatically when it starts.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./.cache/alembic-autogen.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
